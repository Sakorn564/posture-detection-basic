<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ระบบตรวจจับท่านั่ง</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

  <!-- Teachable Machine -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 30px; }
    #canvas { margin-top: 20px; }
    #label-container { margin-top: 20px; font-size: 1.2em; }
    button { padding: 10px 20px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>ระบบตรวจจับท่านั่ง</h1>
  <button id="startBtn">เริ่ม</button>
  <div id="canvas"></div>
  <div id="label-container"></div>

  <script>
    // ✅ Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyBr1hEuLvOVMd-Ylmz3YRkVn0iIrjMX5xE",
      authDomain: "ai-preventive-helth.firebaseapp.com",
      projectId: "ai-preventive-helth",
      storageBucket: "ai-preventive-helth.firebasestorage.app",
      messagingSenderId: "366039897019",
      appId: "1:366039897019:web:6afd10fa16cc98b404ea9e",
      measurementId: "G-5CG9MKWRBJ"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 📷 Teachable Machine Setup
    const URL = "https://teachablemachine.withgoogle.com/models/xtgDT3JxI/";
    let model, webcam, labelContainer, maxPredictions;

    // 🚨 แจ้งเตือนเมื่อ "นั่งผิด" บ่อยเกินไป
    let wrongPostureCount = 0;
    let lastResetTime = Date.now();
    const ALERT_THRESHOLD = 5;
    const ALERT_WINDOW = 10 * 60 * 1000;

    function checkAlert(posture) {
      const now = Date.now();
      if (now - lastResetTime > ALERT_WINDOW) {
        wrongPostureCount = 0;
        lastResetTime = now;
      }

      if (posture === "นั่งผิดหลักการยศาสตร์") {
        wrongPostureCount++;
        if (wrongPostureCount >= ALERT_THRESHOLD) {
          alert("⚠️ คุณนั่งผิดบ่อยเกินไป! กรุณาปรับท่านั่งให้ถูกต้อง");
          wrongPostureCount = 0;
          lastResetTime = now;
        }
      }
    }

    async function startCamera() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();

      webcam = new tmImage.Webcam(400, 400, true);
      await webcam.setup();
      await webcam.play();

      document.getElementById("canvas").appendChild(webcam.canvas);
      labelContainer = document.getElementById("label-container");

      window.requestAnimationFrame(loop);
    }

    async function loop() {
      webcam.update();
      await predict();
      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const prediction = await model.predict(webcam.canvas);
      labelContainer.innerHTML = "";

      prediction.forEach(async (p) => {
        const label = `${p.className}: ${(p.probability * 100).toFixed(2)}%`;
        const div = document.createElement("div");
        div.innerText = label;
        labelContainer.appendChild(div);

        if (p.probability > 0.8) {
          await db.collection("postureLogs").add({
            timestamp: new Date(),
            posture: p.className,
            confidence: (p.probability * 100).toFixed(2)
          });

          checkAlert(p.className);
        }
      });
    }

    document.getElementById("startBtn").addEventListener("click", startCamera);
  </script>
</body>
</html>
